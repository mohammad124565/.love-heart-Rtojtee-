<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسم قلب أحمر</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
            font-family: Arial, sans-serif;
        }

        button {
            padding: 15px 30px;
            font-size: 22px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #e63946;
            color: white;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.1);
        }

        canvas {
            background: transparent;
        }
    </style>
</head>

<body>
    <button id="loveButton">اسف ❤️</button>
    <canvas id="heartCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");
        const button = document.getElementById("loveButton");

        function drawHeartStep(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.beginPath();

            // معادلة قلب
            for (let t = 0; t <= progress; t += 0.01) {
                const x = 200 + 16 * Math.pow(Math.sin(t), 3) * 10;
                const y = 200 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 10;
                if (t === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.closePath();
            ctx.fill();

            // النص داخل القلب
            if (progress >= 2 * Math.PI) {
                ctx.fillStyle = "white";
                ctx.font = "28px Arial";
                ctx.textAlign = "center";
                ctx.fillText("أحبك Rtojtee", 200, 210);
            }
        }

        button.addEventListener("click", () => {
            let progress = 0;
            const interval = setInterval(() => {
                progress += 0.05;
                drawHeartStep(progress);
                if (progress >= 2 * Math.PI) clearInterval(interval);
            }, 30);
        });
    </script>
</body>

</html>
